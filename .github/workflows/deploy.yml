name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # boto3 needs a region to construct clients, and dummy creds keep moto-backed
    # tests hermetic (never reaching real AWS). Locally these come from the dev's
    # AWS config; CI must set them explicitly.
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  deploy:
    needs: test
    # Only deploy on a push to main; on pull_request the test job runs as a gate
    # but we never deploy PR code.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'cdk/**'
              - 'src/**'
              - 'Dockerfile'
              - '.github/workflows/deploy.yml'

      - name: Skip deploy if no infra changes
        if: steps.filter.outputs.infra == 'false'
        run: echo "No infra changes, skipping deploy"

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.infra == 'true'
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        if: steps.filter.outputs.infra == 'true'
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        if: steps.filter.outputs.infra == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Install dependencies
        if: steps.filter.outputs.infra == 'true'
        run: npm ci

      # The CloudFront URL-signing public key is read by the CDK stack at synth
      # (cdk/cloudfront-public-key.pem). It is not secret and is kept out of git,
      # so materialize it from a repo variable. The matching private key lives in
      # SSM (created by scripts/setup-cloudfront-key.sh).
      - name: Materialize CloudFront signing public key
        if: steps.filter.outputs.infra == 'true'
        env:
          CLOUDFRONT_PUBLIC_KEY: ${{ vars.CLOUDFRONT_PUBLIC_KEY }}
        run: printf '%s\n' "$CLOUDFRONT_PUBLIC_KEY" > cloudfront-public-key.pem

      - name: Deploy
        if: steps.filter.outputs.infra == 'true'
        env:
          AWS_NODEJS_CONNECTION_TIMEOUT: '30000'
          AWS_NODEJS_REQUEST_TIMEOUT: '30000'
        run: npx cdk deploy --require-approval never
